<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Broadcast Control</title><link rel="stylesheet" href="style.css"></head><body><main class="control"><header><div class="eyebrow">SEVEN UNIVERSITIES SPLATOON MEET</div><h1>Broadcast Control</h1><p class="note">非公式配信補助ツール / 取得した情報を確認してから配信に反映します。</p></header><aside><section class="panel"><h2>1. データ取得</h2><div class="buttons"><button id="pull">拡張機能から取得</button><button class="secondary" id="watchPull">自動取り込み開始</button><button class="secondary" id="stopPull">停止</button><button class="secondary" id="demo">サンプル読込</button></div><label for="source">リーグ / 大会</label><select id="source"></select><p><a href="mock.html" target="_blank" rel="noopener">模擬大会で4試合同時終了をテスト</a></p><button class="secondary" id="mockPull">模擬大会のデータを取得</button><label for="json">JSONを手動で貼り付ける場合</label><textarea id="json" rows="3"></textarea><button class="secondary" id="import">JSON読込</button><div id="captureStatus" class="status">未取得</div></section><section class="panel"><h2>2. 配信画面</h2><label for="mode">画面</label><select id="mode"><option value="standings">現在の順位</option><option value="board">対戦表</option><option value="result">試合リザルト</option></select><label for="match">試合番号</label><select id="match"></select><label for="battle">リザルトの表示内容</label><select id="battle"><option value="series">シリーズ累計</option></select><label for="detail">詳細リザルト（モーダルの全文）</label><textarea id="detail" rows="5" maxlength="30000" placeholder="拡張機能で詳細取得、またはモーダルの全文を貼り付け"></textarea><div class="buttons"><button class="secondary" id="saveDetail">詳細を解析・保存</button></div><p class="note">無効試合を除外して集計。試合番号・チーム・スコアの一致を確認します。ブキ名に対応。画像は未収録。</p><div id="detailStatus" class="status"></div></section><section class="panel"><h2>3. 配信へ反映</h2><p id="configStatus" class="note"></p><label for="email">運営メールアドレス</label><input id="email" type="email" autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"><div class="buttons"><button id="login">ログイン</button><button id="logout" class="secondary">ログアウト</button></div><label class="check"><input type="checkbox" id="review">このデータを公開してよいことを確認した</label><label class="check"><input type="checkbox" id="autoPublish">このリーグの更新を自動公開する（明示的な許諾・同意がある場合のみ）</label><button id="publish" disabled>OBSへ反映</button><div id="publishStatus" class="status"></div><div id="links" class="links"></div></section></aside><section><div class="panel"><h2>プレビュー（1920 × 1080）</h2><div class="preview" id="preview"><div class="stage" id="stage"></div></div><p class="note" style="margin-top:12px">OBSではブラウザソースの幅1920・高さ1080を指定。公開済みデータを約3秒間隔で取得します。1画面につき1リーグ。8チーム程度までを想定。</p></div></section></main><script src="config.js"></script><script src="extension/detail.js"></script><script src="extension/queue.js"></script><script src="common.js"></script><script src="control.js"></script></body></html>
